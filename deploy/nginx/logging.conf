# /etc/nginx/conf.d/zunopilot-logging.conf
#
# Keep the WhatsApp verify token out of the access log.
#
# Meta verifies a webhook with
#   GET /api/webhook?hub.mode=subscribe&hub.verify_token=<the real token>&hub.challenge=…
# and nginx's `combined` format logs `$request`, which includes the query string. So every
# handshake wrote META_WEBHOOK_VERIFY_TOKEN in plaintext into access.log — a file that
# rotates, compresses, and ends up in backups. The application logger had the same hole; it is
# fixed separately, in app.ts.
#
# This has to live in conf.d because `map` and `log_format` are only valid in the http
# context, and the site files are server-level. Ubuntu's nginx.conf already includes
# /etc/nginx/conf.d/*.conf.
#
# Only the webhook loses its query string. Every other request keeps `$request` intact,
# because a log you cannot debug from is its own kind of failure — `?search=` and `?take=`
# are exactly what you want when a page misbehaves.
#
# NOTE: this file is shared http-level config. It is additive and defines nothing that the
# `zunopilot-dev` tunnel site references, so that site keeps its default `combined` logging.

map $uri $zuno_safe_request {
    default      "$request";
    /api/webhook "$request_method $uri $server_protocol";
}

log_format zuno '$remote_addr - $remote_user [$time_local] "$zuno_safe_request" '
                '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
